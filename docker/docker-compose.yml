# All self-hosted platforms are capped to roughly match the CognoDB free tier
# (burstable 0.5 vCPU, 512 MB RAM, 1 GB disk) so no platform gets a hardware
# advantage. See README "Fairness / resource parity" section.

services:
  memgraph:
    image: memgraph/memgraph:latest
    container_name: bench-memgraph
    ports:
      - "7688:7687"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
    command: ["--memory-limit=450"]

  falkordb:
    image: falkordb/falkordb:latest
    container_name: bench-falkordb
    ports:
      - "6379:6379"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  arangodb:
    image: arangodb:latest
    container_name: bench-arangodb
    environment:
      - ARANGO_ROOT_PASSWORD=changeme
    ports:
      - "8529:8529"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
